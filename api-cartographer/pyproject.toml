[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "api-cartographer"
version = "0.1.0"
description = "Картограф и сопоставитель фактического HTTP API с исходной OpenAPI-спецификацией"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
api-cartographer = "api_cartographer.cli:main"
api-cartographer-healthcheck = "api_cartographer.healthcheck:main"

[tool.setuptools.packages.find]
where = ["src"]

